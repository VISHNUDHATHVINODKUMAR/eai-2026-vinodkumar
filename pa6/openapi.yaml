openapi: 3.0.3
info:
  title: Checkout Saga API
  version: 1.0.0
  description: >-
    Contract for the checkout orchestrator. A single call, POST /checkout,
    takes one canonical order and runs four downstream calls one after the
    other: payment authorization, inventory reservation, shipping creation
    and a customer notification. If a step fails or times out, the steps
    that were already done and can be undone (payment and inventory) are
    reversed, newest first, before the response is sent. Retrying with the
    same Idempotency-Key never runs the saga twice.
  contact:
    name: Vivshnu
servers:
  - url: http://localhost:3000
    description: Local orchestrator started with docker compose.
tags:
  - name: checkout
    description: Running the checkout saga for an order.
  - name: health
    description: Service liveness.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Check that the orchestrator is up
      description: Returns ok when the process is running and can answer requests.
      responses:
        "200":
          description: The orchestrator is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /checkout:
    post:
      operationId: createCheckout
      tags: [checkout]
      summary: Run the checkout saga for one order
      description: >-
        Calls payment, inventory, shipping and notification in that order,
        never in parallel. The amount sent to payment is the sum of
        unitPrice times quantity over all items, as a decimal string with
        two fraction digits. The notification recipient is customer.email.
        On a failure or timeout, inventory is released and payment is
        refunded (only the steps that had completed, newest first). The
        response always contains a trace of every call made, compensations
        included. A request with the same Idempotency-Key and the same body
        returns the first response again with the same status code.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Key chosen by the caller for this checkout attempt. Reusing it
            with the same body replays the stored result. Reusing it with a
            different body, or while the first request is still running, is
            rejected with 409.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        description: >-
          The order to check out, in the canonical order format. It must
          contain between 1 and 20 items.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanonicalOrder"
      responses:
        "200":
          description: All four steps succeeded and the saga is completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: >-
            The Idempotency-Key header is missing, or the body is not a valid
            canonical order, or it has more than 20 items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            The Idempotency-Key was already used with a different body
            (idempotency_payload_mismatch), or the first request with this
            key is still running (idempotency_conflict).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            A step failed. The status is compensated if the rollback worked,
            or failed with code compensation_failed if a rollback call
            failed. If payment itself failed, nothing needed rolling back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "504":
          description: >-
            A downstream call did not answer within the request timeout. The
            code is timeout, and any completed steps were rolled back first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
components:
  schemas:
    HealthStatus:
      type: object
      description: Liveness answer of the orchestrator.
      required: [status]
      properties:
        status:
          type: string
          description: The word ok when the service is running.
          enum: [ok]
    Address:
      type: object
      description: Delivery address of the customer.
      additionalProperties: false
      required: [street, city, postalCode, country]
      properties:
        street:
          type: string
          description: Street name and house number.
          minLength: 1
        city:
          type: string
          description: City or town.
          minLength: 1
        postalCode:
          type: string
          description: Postal code in the local format, for example LV-1001.
          minLength: 1
        country:
          type: string
          description: Two-letter ISO 3166-1 country code, for example LV.
    Customer:
      type: object
      description: The person who placed the order.
      additionalProperties: false
      required: [name, email, address]
      properties:
        name:
          type: string
          description: Full name of the customer.
          minLength: 1
        email:
          type: string
          description: Email address that receives the notification.
          format: email
        address:
          $ref: "#/components/schemas/Address"
    OrderItem:
      type: object
      description: One priced line of the order.
      additionalProperties: false
      required: [productId, productName, quantity, unitPrice, currency, taxRate]
      properties:
        productId:
          type: string
          description: Product identifier, for example PROD-001.
          pattern: "^PROD-[0-9]+$"
        productName:
          type: string
          description: Product name shown to the customer.
          minLength: 1
        quantity:
          type: integer
          description: How many units were ordered.
          minimum: 1
        unitPrice:
          type: string
          description: Price of one unit as a decimal string with two fraction digits, for example "22.50". It is a string so no rounding error can enter.
          pattern: '^-?[0-9]+\.[0-9]{2}$'
        currency:
          type: string
          description: Currency of unitPrice, for example EUR.
        taxRate:
          type: number
          description: Tax rate as a fraction, for example 0.21 for 21 percent.
          minimum: 0
          maximum: 1
    CanonicalOrder:
      type: object
      description: >-
        The canonical order as defined in canonical/order.schema.json, with
        one difference. The canonical schema does not limit the number of
        items. This contract limits it to 20, and the orchestrator enforces
        that limit.
      additionalProperties: false
      required: [orderId, orderType, source, receivedAt, orderDate, customer, items, currency, status]
      properties:
        orderId:
          type: string
          description: Order id assigned by the source system. It is never changed.
          minLength: 1
        orderType:
          type: string
          description: Kind of order.
          enum: [standard, express, b2b]
        source:
          type: string
          description: Which channel the order came from.
          enum: [web, mobile, b2b]
        receivedAt:
          type: string
          description: Time the order was converted to the canonical format.
          format: date-time
        orderDate:
          type: string
          description: Time the order was placed, in UTC.
          format: date-time
        customer:
          $ref: "#/components/schemas/Customer"
        items:
          type: array
          description: >-
            The ordered lines. At most 20, because one checkout should stay
            small enough to retry quickly and a bigger basket should be split.
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/OrderItem"
        currency:
          type: string
          description: Currency of the whole order, for example EUR.
        status:
          type: string
          description: Status of the order when it was received.
          enum: [new, processing, shipped, delivered]
    TraceItem:
      type: object
      description: One downstream call the saga made, in the order it was made.
      required: [step, status, startedAt, finishedAt, durationMs]
      properties:
        step:
          type: string
          description: >-
            Which call this was. The four forward steps are payment,
            inventory, shipping and notification. The two rollback steps are
            inventory_release and payment_refund.
          enum: [payment, inventory, shipping, notification, inventory_release, payment_refund]
        status:
          type: string
          description: Result of the call.
          enum: [success, failed, timeout]
        startedAt:
          type: string
          description: Time the call started, ISO 8601.
          format: date-time
        finishedAt:
          type: string
          description: Time the call ended, ISO 8601.
          format: date-time
        durationMs:
          type: integer
          description: Length of the call in whole milliseconds.
          minimum: 0
    CheckoutResponse:
      type: object
      description: Outcome of one checkout saga, with the full trace.
      required: [orderId, status, trace]
      properties:
        orderId:
          type: string
          description: The orderId of the order that was checked out.
          minLength: 1
        status:
          type: string
          description: >-
            completed when all four steps succeeded, compensated when a step
            failed and the rollback worked, failed when payment failed or a
            rollback call failed.
          enum: [completed, failed, compensated]
        code:
          type: string
          description: >-
            Reason for a non-completed saga. This is timeout, compensation_failed,
            or the error code returned by the failing downstream service,
            for example payment_declined. It is absent when the saga completed.
        trace:
          type: array
          description: >-
            Every call the saga made, compensations included. At most 6: the
            four forward steps plus the two rollback steps.
          maxItems: 6
          items:
            $ref: "#/components/schemas/TraceItem"
    ErrorResponse:
      type: object
      description: Error returned when the request is rejected before or instead of running the saga.
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            Stable error code: validation_error, idempotency_payload_mismatch
            or idempotency_conflict.
          minLength: 1
        message:
          type: string
          description: Plain explanation of what was wrong with the request.
          minLength: 1